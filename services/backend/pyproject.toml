[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreomr"
version = "0.1.0"
description = "ScoreOMR backend: OMR pipeline for local use (no accounts)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.146,<1",
  "uvicorn[standard]>=0.54,<1",
  "python-multipart>=0.0.32,<1",
  "pillow>=11.3,<13",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
# Installed in the heavy worker image and for local end-to-end runs.
omr = [
  "music21>=10.5,<11",
  "numpy>=2.4,<3",
  "opencv-python-headless>=4.13,<5",
  "matplotlib>=3.10,<4",
]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
include = ["app*", "omr_agent*"]

[tool.setuptools.package-data]
app = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:music21.*",
  "ignore::UserWarning:matplotlib.*",
]
