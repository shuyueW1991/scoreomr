# ScoreOMR web tier: static SPA + same-origin API proxy.
#
# The container is bound to 127.0.0.1 on the host (see compose.yml), so the
# normal public entry point is the host TLS proxy or the Caddy container.
# Only trust X-Forwarded-For when the connection comes from a local/private
# proxy (host nginx or the Caddy container). A directly exposed client cannot
# spoof its IP to reset the anonymous quota.
geo $omr_trusted_proxy {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map $omr_trusted_proxy $omr_forwarded_for {
    1 $http_x_forwarded_for;
    0 $remote_addr;
}

map $omr_forwarded_for $omr_client_ip {
    "" $remote_addr;
    default $omr_forwarded_for;
}

map $omr_trusted_proxy $omr_proto {
    1 $http_x_forwarded_proto;
    0 $scheme;
}

map $omr_proto $omr_forwarded_proto {
    "" $scheme;
    default $omr_proto;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml audio/wav audio/mpeg;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omr_client_ip;
        proxy_set_header X-Forwarded-For $omr_client_ip;
        proxy_set_header X-Forwarded-Proto $omr_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
